name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Analyze & Architecture Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --set-exit-if-changed .

      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          test -z "$(git status --porcelain)" || (echo "::error::Generated files (*.g.dart, *.freezed.dart, *.config.dart) are out of date. Run 'dart run build_runner build --delete-conflicting-outputs' locally and commit the changes." && exit 1)

      - name: Verify architecture boundaries
        run: dart run tool/check_architecture.dart

      - name: Analyze code
        run: flutter analyze

      - name: Setup environment configuration
        run: cp env/dev.example.json env/dev.json

      - name: Build Dev APK
        run: flutter build apk --flavor dev -t lib/main.dart --dart-define-from-file=env/dev.json
