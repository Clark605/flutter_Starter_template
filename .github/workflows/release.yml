name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-release:
    name: Build Obfuscated Release Artifacts
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify architecture boundaries
        run: dart run tool/check_architecture.dart

      - name: Analyze code
        run: flutter analyze

      - name: Build Android App Bundle (Obfuscated)
        run: |
          mkdir -p build/symbols/android
          flutter build appbundle \
            --flavor prod \
            -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --obfuscate \
            --split-debug-info=build/symbols/android

      - name: Build iOS Application (No Codesign, Obfuscated)
        run: |
          mkdir -p build/symbols/ios
          flutter build ios \
            --no-codesign \
            -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --obfuscate \
            --split-debug-info=build/symbols/ios

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 14

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols/
          retention-days: 14
