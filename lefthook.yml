pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.dart"
      run: dart format --set-exit-if-changed {staged_files}
    architecture-check:
      run: dart run tool/check_architecture.dart
    analyze:
      run: flutter analyze

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -n 1 "$1" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+' || {
          echo "❌ Invalid commit message format."
          echo "Follow conventional commits, e.g.: feat(auth): add login form"
          exit 1
        }
