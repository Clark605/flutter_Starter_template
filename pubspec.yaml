name: flutter_starter
description: "A production-grade, reusable Flutter starter template."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1

  # Data & Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking & Connectivity
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # UI, Skeletons & Native Splash
  skeletonizer: ^2.1.3
  flutter_native_splash: ^2.4.6

  # Localization & Platform Info
  intl: any
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.0.4
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
