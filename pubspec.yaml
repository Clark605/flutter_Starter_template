name: flutter_starter
description: "A production-grade, reusable Flutter starter template."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1

  # Data & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Networking & Connectivity
  dio: ^5.8.0+1
  connectivity_plus: ^7.3.2

  # Storage & Security
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3

  # UI, Skeletons & Native Splash
  skeletonizer: ^3.0.0
  flutter_native_splash: ^2.4.7

  # Localization & Platform Info
  intl: 0.20.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
